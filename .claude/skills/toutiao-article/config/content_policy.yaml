# =============================================================================
# 头条号自动发布 - 内容策略配置 (v8.0)
# 标题、排版、真实性、禁用词唯一来源。
# =============================================================================

# --- 账号定位 ---
account:
  name: "实用生活攻略馆"
  description: "全品类生活攻略号，覆盖衣食住行+社会民生+生活观察"
  audience:
    age_core: "41岁以上"
    gender: "男女均覆盖"
    language: "直白、短句、少行话"
    font_size: "默认（交给平台）"
  direction_ids:
    - seasonal_health
    - home_energy_saving
    - food_safety
    - shopping_tips
    - consumer_rights
    - home_organization
    - money_management
    - tech_daily
    - workplace
    - renovation
    - mosquito
    - car_tips
    - gold_investment
  content_pillars:
    - key: "食"
      icon: "🍚"
      subdirs: ["厨房技巧", "备餐", "省钱买菜", "食物保存", "厨具测评"]
      examples: ["备餐技巧", "冰箱收纳", "剩菜处理"]
    - key: "衣"
      icon: "👔"
      subdirs: ["衣物护理", "洗涤技巧", "收纳整理", "旧物改造", "穿搭省钱"]
      examples: ["瓶罐改造", "旧衣改制", "洗涤避坑"]
    - key: "住"
      icon: "🏠"
      subdirs: ["居家收纳", "清洁技巧", "装修避坑", "租房维权", "家电使用"]
      examples: ["装修增项", "租房押金", "电器省电"]
    - key: "行"
      icon: "🚗"
      subdirs: ["出行省钱", "机票攻略", "通勤技巧", "自驾准备"]
      examples: ["机票什么时候买", "通勤省钱"]
    - key: "社会事件"
      icon: "📰"
      subdirs: ["民生政策解读", "社保医保", "消费维权", "辟谣防骗"]
      examples: ["医保报销", "消费退款", "政策新规"]
    - key: "生活观察"
      icon: "👴"
      subdirs: ["老人行为观察", "身边小事", "普通人反差故事", "人情世故"]
      examples: ["老人节俭", "邻里小事", "职场人际"]
    - key: "省钱理财"
      icon: "💰"
      subdirs: ["省钱技巧", "理财入门", "副业避坑", "消费观念"]
      examples: ["工资分配", "信用卡积分", "副业避坑"]
    - key: "职场成长"
      icon: "🧠"
      subdirs: ["职场沟通", "加薪谈判", "人际边界", "入职适应"]
      examples: ["拒绝甩锅", "领导批评", "新入职融入"]

# --- 标题策略 ---
title:
  scoring_dimensions:
    body_consistency: 30
    value_clarity: 20
    specificity: 15
    audience_match: 15
    curiosity_no_clickbait: 10
    difference_from_recent: 10
  banned_starters:
    - "你是不是也这样"
    - "你有过吗"
    - "还不快"
    - "赶紧"
  title_forms:
    - desc: "数字+人群/场景+结果承诺"
      example: "每天下班花半小时做这3件事，一年能多存2万块"
    - desc: "身份定位+痛点+解决方案"
      example: "租房党别乱买收纳了！这6样东西反而越收越乱"
    - desc: "颠覆认知+悬念钩子"
      example: "冰箱这5个位置放错，菜两天就烂"
    - desc: "数字+对比+低成本高回报"
      example: "睡前4个习惯坚持一周，比周末补觉管用10倍"

# --- 开头钩子（连续两篇不得同类型）---
hooks:
  - id: 1
    name: "颠覆认知"
    example: "做了这么多年饭，最近才发现炒菜放盐的顺序错了"
  - id: 2
    name: "自嘲踩坑"
    example: "说出来不怕你们笑话，这个空调遥控器我研究了一个夏天"
  - id: 3
    name: "场景代入"
    example: "下午三点，你打开冰箱想拿瓶水，一股闷热扑面而来"
  - id: 4
    name: "真实数据"
    example: "月薪7500，一年存下5万。同事都很疑惑"
  - id: 5
    name: "悬念故事"
    example: "上个月我一个朋友装修，签合同时多问了4句话，省了2万块"
  - id: 6
    name: "精准痛点"
    example: "换了好几个枕头还是睡不好，颈椎反而越来越疼"
  - id: 7
    name: "反常识结论"
    example: "冰箱的冷藏室中间层是最容易串味的位置"

# --- 叙事框架（连续两篇不得同类型）---
frameworks:
  - id: "A"
    name: "踩坑修复对比"
    structure: "犯错X年→幡然醒悟→正确做法→效果对比"
    applies_to: ["省钱", "厨房", "收纳", "家电"]
  - id: "B"
    name: "场景问题解法"
    structure: "具体场景→困境→处理方法→结果验证"
    applies_to: ["职场", "装修", "租房", "医保"]
  - id: "C"
    name: "认知升级"
    structure: "以为…→实际…→为什么→怎么做"
    applies_to: ["社会民生", "生活观察", "理财"]
  - id: "D"
    name: "串珠叙事"
    structure: "触发事件→方法1→方法2→方法3→串联收束"
    applies_to: ["旅行", "备餐", "习惯", "健康"]

# --- 结尾类型（连续两篇不得同类型）---
endings:
  - id: 1
    name: "闭环感悟"
    description: "回到开头场景，轻收"
    example: "写这篇的时候回头看，发现自己以前真能忍"
  - id: 2
    name: "数据验证"
    description: "用自家效果收尾"
    example: "去年七月三百多，今年同一套房子两百出头"
  - id: 3
    name: "延伸思考"
    description: "留一个值得想的角度"
    example: "但很多好用的方法其实是免费的"
  - id: 4
    name: "自嘲总结"
    description: "用自己收尾"
    example: "买的收纳神器有一半是智商税"

# --- 排版规则 ---
formatting:
  cjk_regex: '[一-鿿㐀-䶿豈-﫿]'
  paragraph_split_markers: ["。", "！", "？"]
  bold_count_max: 3                # 全篇最多加粗3处
  forbidden_writing:
    - "然而"
    - "因此"
    - "综上"
    - "由此可见"
    - "值得注意的是"
    - "不难发现"
    - "综上所述"

# --- 真实性规则 ---
authenticity:
  allowed:
    - "常见场景"
    - "普遍现象"
  forbidden:
    - "我一个朋友"
    - "老王"
    - "同事"
    - "有研究表明"          # 无真实来源时禁止
  data_requirements:
    - "数字必须来自可靠来源、页面数据或可复核计算"
    - "没有真实案例时使用'常见场景'，不得伪装亲身经历"
    - "政策、医疗、健康、金融、安全内容必须读取最新可靠来源"
    - "政策内容必须注明适用地区和生效时间"
    - "标题承诺必须在正文中完整兑现"
  bans:
    - "洗稿、拼接常识和同义改写"

# --- 禁用CTA（Call to Action）---
forbidden_cta:
  - "评论区说说"
  - "来评论区说说"
  - "你学会了吗"
  - "你觉得呢"
  - "评论区见"
  - "转发给需要的人"
  - "不妨试试"
  - "要不你也试试"
  - "下次试试看"
  - "你也行动起来吧"
  - "关注我"
  - "求点赞"
  - "求关注"
  - "求转发"
  - "评论区说说你的看法"

# --- 转粉结构字段 ---
follow_structure:
  required_fields:
    - "series_id"
    - "content_pillar"
    - "target_reader"
    - "core_problem"
    - "reader_gain"
    - "next_topic"
  allowed_endings:
    - "一个自然的开放问题"
    - "下一篇将解决的问题"

# --- 图片风格 ---
image_style:
  style: "写实摄影"
  scenes: "中国家庭生活场景"
  lighting: "自然光，写实质感"
  angle: "平视或偏俯拍"
  quality: "真实像素照片质感"
  people: "有生活痕迹但没有人"
  size: "1024x1024"
  prompt_keywords: "realistic, photorealistic, documentary photography, natural lighting, authentic home scene"
